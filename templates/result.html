<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 30px; background: #f8f9fa; }
        .card { max-width: 500px; margin: 0 auto; text-align: center; }
        .prediction-value { font-size: 72px; font-weight: bold; color: #0d6efd; }
        .prediction-label { font-size: 18px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="card shadow p-5">
        <h2 class="mb-4">Prediction Result</h2>
        <div class="prediction-value">{{ predicted_orders }}</div>
        <div class="prediction-label mb-4">predicted orders this hour</div>
        <table class="table table-sm text-start">
            <tr><td><strong>Hub</strong></td><td>{{ hub_name }}</td></tr>
            <tr><td><strong>Hub ID</strong></td><td>{{ hub_id }}</td></tr>
            <tr><td><strong>City</strong></td><td>{{ hub_city }}</td></tr>
            <tr><td><strong>Time</strong></td><td>{{ hour }}:00 on {{ day }}/{{ month }}</td></tr>
        </table>
        <a href="/predict_form" class="btn btn-outline-primary mt-3">Predict Again</a>
    </div>
</body>
</html>
